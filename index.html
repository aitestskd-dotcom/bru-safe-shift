<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='robots' content='noindex'>
<title>SafeShift</title>
<style>
:root{--brand:#9e1b21;--dark:#3a1c12;--gold:#f2b632;--blue:#1f36c7;--cream:#fbf4e6;--green:#2e8b57;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--dark);font-family:system-ui,'Noto Sans','Noto Sans Devanagari','Noto Sans Tamil',Arial,sans-serif;color:var(--dark)}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--cream);display:flex;flex-direction:column}
header{background:var(--brand);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px}.logo img{height:30px;max-width:120px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.wm{font-weight:900;font-size:26px;font-style:italic;letter-spacing:-1px;color:#fff;text-shadow:2px 2px 0 var(--dark)}
.sub{font-size:12px;opacity:.9}
.bar{height:8px;background:#e3d3b5}.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
main{padding:16px;flex:1}
h1{font-size:25px;margin:6px 0}h2{font-size:19px;margin:8px 0 12px;line-height:1.35}h3{margin:4px 0 8px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.12);margin-bottom:12px}
.scene{background:linear-gradient(135deg,#fff3d0,#f7d9a0);border-radius:16px;text-align:center;font-size:46px;padding:14px 8px;letter-spacing:6px;border:3px solid var(--gold)}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:10px;background:var(--dark);color:var(--gold);margin:6px 4px 0 0}
.tag.b{background:var(--blue);color:#fff}
button{font:inherit;cursor:pointer}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid var(--brand);background:#fff;border-radius:12px;font-size:17px;color:var(--dark)}
.opt .ic{font-size:34px;min-width:44px;text-align:center}
.opt.good{background:#d8f0e0;border-color:var(--green)}.opt.bad{background:#f8d9d5;border-color:var(--red)}
.big{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--gold);color:var(--dark);font-weight:700;font-size:18px;margin-top:12px}
.big.alt{background:var(--brand);color:#fff}
.sm{padding:8px 12px;border-radius:8px;border:1px solid var(--brand);background:#fff;color:var(--brand);font-weight:600;margin:3px}
.sm.on{background:var(--brand);color:#fff}
.chip{display:block;width:100%;text-align:left;padding:12px;margin:6px 0;border:2px solid #d8c6a3;background:#fff;border-radius:10px;font-size:16px;color:var(--dark)}
.chip.on{border-color:var(--brand);background:#fde8e8;font-weight:700}
input[type=checkbox]{width:auto;margin-right:6px}
input,select,textarea{font:inherit;width:100%;padding:11px;margin:5px 0;border:1px solid #c9b48f;border-radius:8px;background:#fff}
.timer{height:6px;background:#e3d3b5;border-radius:3px;margin:8px 0}.timer i{display:block;height:100%;background:var(--red);width:100%}
.fb{padding:12px;border-radius:10px;margin-top:10px;font-size:16px;background:#fff7e0;border-left:6px solid var(--gold)}
.trait{margin:9px 0}.trait .l{display:flex;justify-content:space-between;font-size:14px}
.trait .t{height:12px;background:#eadcc2;border-radius:6px;overflow:hidden}.trait .t i{display:block;height:100%;background:var(--brand)}
.code{font-size:25px;letter-spacing:3px;text-align:center;background:var(--dark);color:var(--gold);padding:12px;border-radius:10px;margin:10px 0}
small{color:#7a6652}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #eadcc2;padding:6px 4px;text-align:left}
.kpi{display:flex;gap:8px}.kpi div{flex:1;background:var(--dark);color:var(--gold);border-radius:10px;padding:10px;text-align:center}.kpi b{display:block;font-size:22px}
</style></head><body>
<div id='app'>
<header><div class='logo' id='logo'></div><span id='hud' class='sub'></span></header>
<div class='bar'><i id='prog'></i></div>
<main id='main'></main>
</div>
<script src='data.js'></script>
<script src='data2.js'></script>
<script src='data3.js'></script>
<script src='data4.js'></script>
<script src='data5.js'></script>
<script src='data6.js'></script>
<script src='data7.js'></script>
<script src='app.js'></script>
</body></html>
